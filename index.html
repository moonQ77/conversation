<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>말로 설득하기 – 설득 전략 대화 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f0e6; --card:#fffdf9; --ink:#22314a; --muted:#6b7488; --line:#e7dccb;
  --accent:#e4572e; --accent-soft:#fde3d8; --teal:#2f7d6d; --teal-soft:#dcefe9;
  --gold:#f2b134; --gold-soft:#fdf0d2; --done:#2f9e6b; --warn:#c0841a;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.55}
button{font:inherit;cursor:pointer}
h1,h2,h3,.display{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:.01em}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:20px}

/* ---------- setup ---------- */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:8px 0 20px}
.hero h1{font-size:2.4rem;margin:0;line-height:1.1}
.hero p{margin:6px 0 0;color:var(--muted)}
.tag{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:700}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.step h2{font-size:1.35rem;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:1rem}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;transition:.15s;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.card:hover{border-color:#d4c4ab;transform:translateY(-2px)}
.card.on{border-color:var(--accent);background:var(--accent-soft)}
.card .emoji{font-size:1.8rem}
.card b{font-family:"Jua";font-weight:400;font-size:1.15rem}
.card small{color:var(--muted)}
.card li b{font-family:inherit;font-size:inherit;font-weight:700;color:var(--ink)}
.sub{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sub label.lbl{font-weight:700;margin-right:6px;min-width:78px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;color:var(--ink)}
.chip.on{border-color:var(--teal);background:var(--teal-soft);font-weight:700}
.chip input{border:0;outline:0;font:inherit;width:120px;background:transparent}
.listener-pick{display:flex;gap:12px;flex-wrap:wrap}
.lp{border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px 6px 8px;width:140px;text-align:center;color:var(--ink)}
.lp.on{border-color:var(--teal);background:var(--teal-soft)}
.lp .mini{width:100%;aspect-ratio:6/5;border-radius:10px;overflow:hidden;display:block}
.lp .mini svg{width:100%;height:100%;display:block}
.lp span{font-family:"Jua";font-size:1.1rem}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.level ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:.92rem}
.goal{background:var(--gold-soft);border:1px dashed var(--gold);border-radius:14px;padding:14px 16px;font-size:.95rem}
.goal b{color:#8a5a00}
.start-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px}
.name-in{border:2px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;min-width:220px;background:#fff}
.btn{border:0;border-radius:14px;padding:12px 22px;font-weight:700;background:var(--ink);color:#fff}
.btn.big{font-size:1.15rem;padding:14px 28px;background:var(--accent)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.teal{background:var(--teal)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- talk ---------- */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.topbar h2{margin:0;font-size:1.4rem;flex:1;min-width:200px}
.badge{border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem}
.badge.normal{background:var(--teal-soft);color:var(--teal)}
.badge.easy{background:var(--gold-soft);color:#8a5a00}
.timer{font-weight:700;border-radius:999px;padding:4px 12px;background:#fff;border:2px solid var(--line);font-variant-numeric:tabular-nums}
.timer.low{border-color:var(--accent);color:var(--accent);animation:pulse 1s infinite}
.badge.hard{background:var(--accent-soft);color:var(--accent)}
.turns{display:flex;align-items:center;gap:6px;font-weight:700}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:block}
.dots i.used{background:#d9cfbf}
.iconbtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;color:var(--ink);font-weight:500}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:16px;align-items:start}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#222;box-shadow:0 10px 30px rgba(34,49,74,.18);aspect-ratio:6/5}
.stage svg.avatar{width:100%;height:100%;display:block}
.vidav{width:100%;height:100%;overflow:hidden;position:relative;background:#efe6dc}
.vidav .cam{position:absolute;inset:0;transform-origin:50% 45%;will-change:transform}
.vidav img.poster,.vidav video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.vidav video{transition:opacity .4s ease}
.vidav video.idleloop{transition:opacity .5s ease;z-index:0}
.vidav video.clip{z-index:1;transition:none}
.vidav canvas.lipgl{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .3s ease;pointer-events:none}
.lp .mini .vidav,.result-hero .face .vidav{aspect-ratio:6/5;height:auto}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 80px rgba(0,0,0,.22)}
.status{position:absolute;top:12px;left:12px;background:rgba(20,26,38,.72);color:#fff;border-radius:999px;padding:5px 12px;font-size:.85rem;display:flex;gap:8px;align-items:center;z-index:2}
.status .led{width:9px;height:9px;border-radius:50%;background:#9aa3b2}
.status.speaking .led{background:#ff5d5d;animation:pulse 1s infinite}
.status.listening .led{background:#4cd18f;animation:pulse 1s infinite}
.status.thinking .led{background:var(--gold);animation:pulse .6s infinite}
@keyframes pulse{50%{opacity:.35}}
.who{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.88);border-radius:999px;padding:5px 14px;font-family:"Jua";font-size:1.05rem;z-index:2}
.subtitle{position:absolute;left:5%;right:5%;bottom:16px;text-align:center;z-index:2;pointer-events:none}
.subtitle span{display:inline;background:rgba(15,20,30,.78);color:#fff;font-size:1.12rem;line-height:1.75;padding:4px 10px;border-radius:8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.replay{position:absolute;right:12px;top:54px;z-index:3;background:rgba(255,255,255,.9);border:0;border-radius:999px;padding:6px 12px;font-weight:700;color:var(--ink)}
.playover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(15,20,30,.38);z-index:4}
.playover button{background:#fff;border:0;border-radius:999px;padding:16px 28px;font-family:"Jua";font-size:1.4rem;color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.composer{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;gap:10px;align-items:stretch}
.mic{flex:0 0 auto;width:72px;border-radius:14px;border:0;background:var(--accent);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;gap:2px}
.mic svg{width:26px;height:26px}
.mic.rec{background:#2f9e6b}
.mic .ico-done{display:none}.mic.rec .ico-done{display:block}.mic.rec .ico-mic{display:none}
.mic.rec::after{content:"● 듣는 중";font-size:.68rem;font-weight:500;opacity:.9;animation:pulse 1.1s infinite}
.mic:disabled{opacity:.45;cursor:not-allowed}
.voicehelp.strong{background:var(--gold-soft);border:1px dashed var(--gold);border-radius:12px;padding:10px 12px;color:var(--ink)}
.composer textarea{flex:1;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:1.05rem;resize:none;min-height:78px;background:#fff;color:var(--ink)}
.composer textarea:focus{outline:none;border-color:var(--teal)}
.send{flex:0 0 auto;width:86px;border-radius:14px;border:0;background:var(--ink);color:#fff;font-weight:700}
.send:disabled{opacity:.4}
.voicehelp{font-size:.88rem;color:var(--muted);margin-top:8px;padding:0 4px}
.voicehelp b{color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:1.2rem;display:flex;align-items:center;justify-content:space-between;gap:8px}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.check li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:#faf6ef;transition:background .4s}
.check li.ok{background:#e4f4ea}
.check li.flash{animation:flash 1.2s}
@keyframes flash{0%{background:#fff3b0}100%{}}
.box{flex:0 0 22px;height:22px;border-radius:7px;border:2px solid #cdbfa8;display:grid;place-items:center;background:#fff;margin-top:1px}
.ok .box{background:var(--done);border-color:var(--done)}
.ok .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check .t{font-weight:700}
.check .d{font-size:.84rem;color:var(--muted)}
.minis{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.mchip{font-size:.75rem;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.mchip.y{background:var(--done);color:#fff;border-color:var(--done)}
.concern-list{margin:4px 0 0;padding:0;list-style:none;font-size:.85rem}
.concern-list li{padding:2px 0;background:none;display:block}
.concern-list li.y{color:var(--done);font-weight:700}
.concern-list li.y::before{content:"✓ "}
.concern-list li.n::before{content:"○ ";color:#b9ab93}
.fb{display:flex;flex-direction:column;gap:10px}
.fb .empty{color:var(--muted);font-size:.92rem}
.fbrow{border-radius:12px;padding:10px 12px;font-size:.95rem}
.fbrow.good{background:#e4f4ea}
.fbrow.improve{background:#fdeee6}
.fbrow b{display:block;font-size:.85rem;margin-bottom:2px}
.fbrow.good b{color:var(--done)}
.fbrow.improve b{color:var(--accent)}
.schips{display:flex;flex-wrap:wrap;gap:6px}
.schip{font-size:.8rem;border-radius:999px;padding:3px 10px;font-weight:700}
.schip.v{background:var(--teal-soft);color:var(--teal)}
.schip.x{background:#efe7da;color:#8b7d66;text-decoration:line-through;text-decoration-thickness:1px}
.schip.c{background:var(--gold-soft);color:#8a5a00}
.fbmeta{font-size:.8rem;color:var(--muted)}
.hint{background:var(--gold-soft);border:1px dashed var(--gold);border-radius:12px;padding:10px 12px;font-size:.92rem;margin-top:10px}
.hint p{margin:0 0 8px}.hint p:last-child{margin:0}
.hint em{font-style:normal;color:#7a5200;display:block;margin-top:2px;font-size:.88rem}
.teacher-ico{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:inline-grid;place-items:center;font-size:.9rem}
.err{background:#fdecea;color:#a12a1b;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.92rem}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(20,26,38,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal .inner{background:var(--card);border-radius:18px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:20px 22px}
.modal h3{margin:0 0 12px;font-size:1.35rem}
.logitem{border-bottom:1px solid var(--line);padding:10px 0}
.logitem .s{font-weight:700}
.logitem .l{color:var(--teal)}
.row{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.row select,.row input[type=range]{flex:1;min-width:160px}
select{font:inherit;padding:6px 8px;border-radius:10px;border:2px solid var(--line);background:#fff}

/* ---------- result ---------- */
.result-hero{border-radius:20px;padding:22px 24px;display:flex;gap:20px;align-items:center;margin-bottom:16px}
.result-hero.win{background:linear-gradient(120deg,#e4f4ea,#fdf0d2)}
.result-hero.lose{background:linear-gradient(120deg,#f2ece2,#fde3d8)}
.result-hero h1{margin:0;font-size:2.1rem}
.result-hero p{margin:4px 0 0}
.result-hero .face{width:150px;flex:0 0 150px;border-radius:16px;overflow:hidden}
.result-hero .face svg{display:block;width:100%}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.turnfb{border-top:1px solid var(--line);padding:12px 0}
.turnfb:first-child{border-top:0}
.turnfb .q{font-weight:700;margin-bottom:6px}
textarea.report{width:100%;min-height:120px;border-radius:12px;border:2px solid var(--line);padding:10px;font:inherit;font-size:.85rem;background:#fff}

@media (max-width:900px){
  .cards{grid-template-columns:1fr 1fr}
  .grid,.rgrid,.levels{grid-template-columns:1fr}
  .hero{flex-direction:column;align-items:flex-start}
  .result-hero{flex-direction:column;text-align:center}
}
</style>
</head>
<body>
<div class="wrap">

<!-- ===================== SETUP ===================== -->
<section id="setup">
  <div class="hero">
    <div>
      <span class="tag">중3 국어 · 말하기 · 설득 전략</span>
      <h1 style="margin-top:8px">말로 설득하기</h1>
      <p>설득 전략을 써서 부모님과 선생님의 마음을 움직여 보세요. 상대는 말로 대답하고, 선생님이 매번 피드백을 해 줍니다.</p>
    </div>
  </div>

  <div class="step">
    <h2><span class="num">1</span>상황 고르기</h2>
    <div class="cards" id="scenarioCards"></div>
    <div id="itemRow" class="sub hidden">
      <label class="lbl">사고 싶은 것</label>
      <div id="itemChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div id="petRow" class="sub hidden">
      <label class="lbl">키우고 싶은 동물</label>
      <div id="petChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div id="listenerRow" class="sub hidden">
      <label class="lbl">누구를 설득?</label>
      <div class="listener-pick" id="listenerPick"></div>
    </div>
  </div>

  <div class="step">
    <h2><span class="num">2</span>난이도 고르기</h2>
    <div class="levels">
      <button class="card level" data-level="easy">
        <b>쉬움</b>
        <ul>
          <li>힌트 <b>5번까지</b> 보기 가능, 말할 기회 10번</li>
          <li>근거와 주장의 연결이 조금 느슨해도 인정</li>
          <li>이성·감성·인성적 설득 전략 중 <b>2가지 이상</b> 사용</li>
          <li>상대의 걱정 3가지 중 <b>1가지 이상</b> 해결</li>
        </ul>
      </button>
      <button class="card level on" data-level="normal">
        <b>보통</b>
        <ul>
          <li>힌트 <b>3번까지</b> 보기 가능, 말할 기회 11번</li>
          <li>근거와 주장의 연결이 조금 느슨해도 인정, 전략을 쓰려는 의도가 보이면 인정</li>
          <li>이성·감성·인성적 설득 전략 <b>3가지 모두</b> 사용 (논증은 없어도 됨)</li>
          <li>상대의 걱정 3가지 중 <b>2가지 이상</b> 해결</li>
        </ul>
      </button>
      <button class="card level" data-level="hard">
        <b>어려움</b>
        <ul>
          <li>힌트 <b>2번까지</b> 보기 가능, 말할 기회 12번</li>
          <li>논증 형식을 갖춰야 인정 (귀납: 사례 2개 이상 또는 통계 / 유추: 두 대상의 유사성 / 연역: 3단 논법)</li>
          <li>논증 1개 포함 이성적 설득 전략 <b>2가지</b>, 감성적 설득 전략 <b>1가지</b>, 인성적 설득 전략 <b>1가지</b></li>
          <li>근거가 주장과 관련 있어야 함, 떼쓰기·협박은 감성 전략 불인정</li>
          <li>상대의 걱정 <b>3가지 모두</b> 해결</li>
        </ul>
      </button>
    </div>
  </div>

  <div class="step">
    <h2><span class="num">3</span>성공 조건 확인하고 시작하기</h2>
    <div class="goal" id="goalBox"></div>
    <div class="start-row" style="margin-top:14px">
      <input class="name-in" id="nameIn" placeholder="학번 이름 (예: 3105 김하늘)" maxlength="30">
      <button class="btn big" id="startBtn" disabled>대화 시작하기 ▶</button>
      <span id="startNote" style="color:var(--muted);font-size:.9rem">상황과 청자를 골라 주세요.</span>
    </div>
  </div>
</section>

<!-- ===================== TALK ===================== -->
<section id="talk" class="hidden">
  <div class="topbar">
    <h2 id="talkTitle"></h2>
    <span class="badge" id="levelBadge"></span>
    <span class="timer" id="timer">⏱ 7:30</span>
    <div class="turns"><span>남은 기회 <span id="turnLeft">10</span></span><div class="dots" id="dots"></div></div>
    <button class="iconbtn" id="logBtn">대화 기록</button>
    <button class="iconbtn" id="setBtn">소리 설정</button>
    <button class="iconbtn" id="quitBtn">그만하기</button>
  </div>
  <div class="grid">
    <div>
      <div class="stage" id="stage">
        <div class="status" id="status"><span class="led"></span><span id="statusText">대기 중</span></div>
        <div class="who" id="whoTag"></div>
        <div id="avatarHost" style="width:100%;height:100%"></div>
        <div class="subtitle" id="subtitle"></div>
        <button class="replay hidden" id="replayBtn">↻ 다시 듣기</button>
        <div class="playover" id="playOver"><button id="playBtn">▶ 대화 시작</button></div>
      </div>
      <div class="composer">
        <button class="mic" id="micBtn" title="눌러서 말하기">
          <svg class="ico-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          <svg class="ico-done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          <span id="micLabel">말하기</span>
        </button>
        <textarea id="say" placeholder="말하기를 누르고 말한 뒤 완료를 누르세요. 말한 내용이 여기에 글자로 나타나요."></textarea>
        <button class="send" id="sendBtn" disabled>보내기</button>
      </div>
      <div class="voicehelp" id="voiceHelp"></div>
      <div id="errBox"></div>
    </div>
    <div>
      <div class="panel">
        <h3>설득 미션 <span id="hintWrap"></span></h3>
        <ul class="check" id="checklist"></ul>
        <div id="hintBox"></div>
      </div>
      <div class="panel">

function josa(word, a, b){ // a: 받침 있을 때, b: 없을 때
  const ch = word.trim().slice(-1); const c = ch.charCodeAt(0);
  if (c>=0xAC00 && c<=0xD7A3) return ((c-0xAC00)%28)? a : b;
  if (/[0-9]/.test(ch)) return '013678'.includes(ch)? a : b;

}

/* 실시간 입 여닫기 (WebGL): 재생 중인 말하는 영상의 아랫입술·턱 부분만 위아래로 부드럽게 옮김 */
const LipGL = {
  make(canvas){
    let gl = null;
    try{ gl = canvas.getContext('webgl', {alpha:false, antialias:false, premultipliedAlpha:false}) || canvas.getContext('experimental-webgl'); }catch(e){}
    if (!gl) return null;
    const vs = `attribute vec2 a; varying vec2 uv; void main(){ uv = vec2((a.x+1.0)*0.5, (1.0-a.y)*0.5); gl_Position = vec4(a,0.0,1.0); }`;
    const fs = `#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D tex; uniform vec2 res;
uniform float mx, yu, yl, hw0, tt, kk, sh;
varying vec2 uv;
float sst(float e0, float e1, float x){ float t = clamp((x-e0)/max(e1-e0,1e-4), 0.0, 1.0); return t*t*(3.0-2.0*t); }
void main(){
  vec2 p = uv*res;
  float hw = max(30.0, hw0);
  float dx = p.x - mx; float ax = abs(dx);
  float dxc = clamp(dx, -hw*1.1, hw*1.1);
  float ytop = yu + tt*dxc + kk*dxc*dxc;
  float wx = exp(-pow(max(ax - hw*0.9, 0.0)/75.0, 2.0));
  float e = 0.01 + 22.0*clamp((ax - hw*0.95)/40.0, 0.0, 1.0);
  float top = sst(ytop - e, ytop + e, p.y);
  float chin = yl + 45.0;
  float fade = 1.0 - sst(chin, chin + 110.0, p.y);
  float w = wx*top*fade;
  float sy;
  if (sh >= 0.0){ sy = p.y + sh*w; }
  else {
    float op = -sh; float q = p.y - ytop; float s = max(2.0, yl - yu); float ow = op*w;
    if (q < 0.0) sy = p.y; else if (q < s + ow) sy = ytop + q*s/max(s + ow, 0.001); else sy = p.y - ow;
  }
  gl_FragColor = texture2D(tex, vec2(p.x/res.x, clamp(sy, 0.5, res.y-0.5)/res.y));
}`;
    const sh = (type, src)=>{ const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
    try{
      const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr);
      if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error('link');
      gl.useProgram(pr);
      const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      const U = {}; ['tex','res','mx','yu','yl','hw0','tt','kk','sh'].forEach(n=>U[n] = gl.getUniformLocation(pr, n));
      gl.uniform1i(U.tex, 0); gl.uniform2f(U.res, canvas.width, canvas.height);
      gl.viewport(0, 0, canvas.width, canvas.height);
      return {
        upload(video){ gl.bindTexture(gl.TEXTURE_2D, tex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video); },
        draw(P){
          gl.uniform1f(U.mx, P.mx); gl.uniform1f(U.yu, P.yu); gl.uniform1f(U.yl, P.yl); gl.uniform1f(U.hw0, P.hw);
          gl.uniform1f(U.tt, P.t); gl.uniform1f(U.kk, P.k); gl.uniform1f(U.sh, P.shift);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }
      };
    }catch(e){ console.warn('LipGL', e); return null; }
  }
};
/* 대사 영상 재생기: 정해진 대사 영상을 차례로 틀고, 사이사이는 정지 화면 */
const FRONT_CLIP = {'이성':4,'감성':5,'인성':6,'부족':7,'떼쓰기':8,'해결1':10,'해결2':12,'해결3':14};
const REMAIN_CLIP = {1:9, 2:11, 3:13};
const CLIP_SEC = {1:11,2:7,3:7,4:4,5:5,6:5,7:5,8:5,9:4,10:4,11:5,12:5,13:4,14:4,15:4};
// 듣는 영상에서 정면을 보고 가만히 있는 구간(초). 대사 영상은 이 장면에서 시작하고 이 장면으로 끝남
const IDLE_REST = [[0.0, 1.542], [1.833, 2.458], [3.333, 5.042], [5.333, 6.25], [7.125, 8.667], [8.958, 9.792], [11.625, 13.792], [14.667, 16.792], [17.667, 18.458], [18.75, 20.375], [21.25, 21.708], [22.0, 24.125], [25.958, 26.917], [27.208, 28.25], [30.083, 31.042], [31.333, 32.75], [33.625, 36.167], [37.042, 39.375], [40.25, 43.167], [45.0, 45.458], [45.75, 47.292], [48.167, 48.917], [49.208, 50.333], [51.208, 54.208], [56.042, 58.333], [59.208, 59.75], [60.042, 62.25]];
const Clips = {
  token:0, front:0, timer:null, blobs:{},
  on(){ return state.listener==='mom' && state.scenario==='item' && !!(MEDIA.mom && MEDIA.mom.clips); },
  els(){ const V = Avatar.vid; return V && V.el.isConnected && V.slots ? V.slots : null; },
  idle(){ const V = Avatar.vid; return V && V.idleEl; },
  line(id){ return MEDIA.mom.lines[id] || ''; },
  url(id){ return this.blobs[id] || MEDIA.mom.clips[id]; },
  preload(){
    if (this._pre) return; this._pre = true;
    fetch(MEDIA.mom.idleLoop).then(r=>r.ok? r.blob() : null).then(b=>{ if (b) this.idleBlob = URL.createObjectURL(b); }).catch(()=>{});
    Object.entries(MEDIA.mom.clips).forEach(([id,u])=>{
      fetch(u).then(r=>r.ok? r.blob() : null).then(b=>{ if (b) this.blobs[id] = URL.createObjectURL(b); }).catch(()=>{});
    });
  },
  atRest(){ const iv = this.idle(); if (!iv) return true; const t = iv.currentTime;
    return IDLE_REST.some(([a,b])=>t>=a && t<=b-0.15); },
  // 듣는 영상을 '가만히 있는 구간'의 처음으로 옮겨 멈춰 둠 (대사 영상 뒤에 가려져 있을 때)
  parkIdle(){ const iv = this.idle(); if (!iv) return; try{ iv.pause();
    const t = iv.currentTime, runs = IDLE_REST.filter(([a,b])=>b-a>=1.2);
    const r = runs.find(([a])=>a>t) || runs[0];
    // 미리 받아 둔 듣는 영상으로 바꿔 두면 원하는 장면으로 정확히 옮길 수 있음 (가려져 있을 때만)
    if (this.idleBlob && iv.getAttribute('src')!==this.idleBlob){
      iv.setAttribute('src', this.idleBlob); iv.addEventListener('loadedmetadata', ()=>{ try{ iv.currentTime = r[0]; }catch(e){} }, {once:true}); iv.load();
    } else iv.currentTime = r[0]; }catch(e){} },
  resumeIdle(){ const iv = this.idle(); if (iv){ const p = iv.play(); if (p && p.catch) p.catch(()=>{}); } },
  visible(){ const vs = this.els(); return vs ? vs.find(v=>v.style.opacity==='1') : null; },
  play(ids, after){
    const tok = ++this.token; ids = ids.filter(Boolean);
    state.lastClips = ids.slice(); $('#replayBtn').classList.add('hidden');
    const finish = ()=>{
      const vs = this.els(); if (vs) vs.forEach(v=>{ v.style.opacity = 0; });
      this.resumeIdle();
      Avatar.setMode('idle'); setStatus('idle'); $('#replayBtn').classList.remove('hidden');
      after && after();
    };
    const next = ()=>{
      if (tok!==this.token) return;
      clearTimeout(this.timer);
      const id = ids.shift(); const vs = this.els();
      if (id==null || !vs){ finish(); return; }
      const v = vs[this.front], o = vs[1-this.front], src = this.url(id);
      this.front = 1-this.front;
      v.muted = false; v.loop = false; v.onended = null; v.onplaying = null; v.style.zIndex = 3; o.style.zIndex = 2;
      if (v.getAttribute('src')!==src){ v.setAttribute('src', src); try{ v.load(); }catch(e){} }
      try{ v.currentTime = 0; }catch(e){}
      const go = ()=>{
        if (tok!==this.token) return;
        showSubtitle(this.line(id)); Avatar.mode = 'speaking'; setStatus('speaking');
        v.onplaying = ()=>{ if (tok!==this.token) return; v.onplaying = null;
          v.style.opacity = 1; o.style.opacity = 0; try{ o.pause(); }catch(e){} this.parkIdle(); };
        let handed = false;
        const hand = ()=>{ if (handed || tok!==this.token) return; handed = true; clearTimeout(this.timer);
          if (ids.length) next(); else finish(); };
        v.onended = hand;
        this.timer = setTimeout(hand, ((CLIP_SEC[id]||6)+4)*1000);
        const pr = v.play();
        if (pr && pr.then) pr.then(()=>{ if (v.onplaying) setTimeout(()=>{ if (v.onplaying && !v.paused) v.onplaying(); }, 120); }).catch(()=>{});

      };

const LIP_OPEN = {rest:0, closed:0, I:0.25, U:0.4, E:0.55, O:0.6, A:0.95};

const Avatar = {

  setMood(m){ this.mood = MOODS[m]? m : 'neutral'; if (this.C && this.C.video) this.pickClip(); },
  setMode(m){ this.mode = m; if (this.C && this.C.video) this.pickClip(); },
  // ---- 영상 캐릭터 ----
  mountVideo(){

  mouthD(w,h,s,cy){

  },
  // 실사 캐릭터: 실제 표정 사진에서 떼어 낸 입·눈 조각을 소리에 맞춰 바꿔 끼움
  tickKit(t, C, M){

      const s = Lip.current(t); let v = s.shape;

        if (Ly[key]) want[key] = 1;
      }
    }

    const bt = t - this.blinkT;

    let sc = 1.03 + Math.sin(t/1700)*0.004, tx = 0, ty = 0;

    else if (this.mode==='listening'){ ty = Math.max(0, Math.sin(t/380))*1.6; }
    else if (this.mode==='thinking'){ tx = -2 + Math.sin(t/1100)*0.6; sc += 0.01; }
    if (this.mood==='happy' && this.mode!=='speaking') ty += Math.sin(t/460)*0.8;
    this.cam.setAttribute('transform', `translate(240 200) scale(${sc.toFixed(4)}) translate(${(-240+tx).toFixed(2)} ${(-200+ty).toFixed(2)})`);
  },
  // 이미지 캐릭터: 아래턱 영역을 내려 입을 벌리고, 눈꺼풀을 덮어 깜빡임
  tickImg(t, C, M){

    if (d > 0.6){
      const bot = y0 + d + 4;
      const path = `M${cx-a} ${y0} Q${cx} ${y0-1.2} ${cx+a} ${y0} C${cx+a*0.55} ${bot+1} ${cx-a*0.55} ${bot+1} ${cx-a} ${y0} Z`;
      P.mIn.setAttribute('d', path); P.mClip.setAttribute('d', path); P.mIn.style.display = '';
      P.teeth.setAttribute('y', y0-1.2); P.teeth.setAttribute('height', Math.min(2.6, d*0.22));
      P.tongue.setAttribute('cy', y0+d+4); P.tongue.setAttribute('rx', a*0.5); P.tongue.setAttribute('ry', d*0.35);

      lash.setAttribute('d', `M${x-15} ${side} Q${x} ${mid} ${x+15} ${side}`);

    else if (this.mode==='listening'){ ty = Math.max(0,Math.sin(t/330))*2.4; rot = Math.sin(t/1400)*0.5; }
    else if (this.mode==='thinking'){ rot = -1.6 + Math.sin(t/900)*0.3; }
    else { rot = Math.sin(t/2600)*0.5; }
    if (this.mood==='happy' && this.mode!=='speaking') rot += Math.sin(t/500)*0.6;
    P.head.setAttribute('transform', `rotate(${rot.toFixed(2)} ${px} ${py}) translate(0 ${ty.toFixed(2)})`);
    P.body.setAttribute('transform', `translate(0 ${(Math.sin(t/1500)*1.1).toFixed(2)}) scale(1 ${(1+Math.sin(t/1500)*0.003).toFixed(4)})`);
  },
  tick(t){
    requestAnimationFrame(tt=>this.tick(tt));
    if (!this.el) return;
    const P = this.parts, M = MOODS[this.mode==='thinking'?'thinking':this.mood];
    // mouth target
    const C = this.C || {};
    if (C.video){
      if (!this.vid || !this.vid.el.isConnected) return;
      const MV = MEDIA[C.video] || {};
      if (MV.lips && (this.vid.showing==='talk' || this.mode==='speaking')) this.tickLip(t);
      if (!MV.clips){ // 보여 줄 영상이 준비되면 바로 전환 (이벤트를 놓쳐도 스스로 맞춤)
        const V = this.vid, wantTalk = this.mode==='speaking' && V.talk.getAttribute('src');
        if (wantTalk && V.showing!=='talk' && V.talk.readyState >= 2) this.showLayer('talk');
        else if (!wantTalk && V.showing!=='idle' && V.idle.readyState >= 2) this.showLayer('idle');
      }

      if (!MV.idle){ // 영상이 없을 때만 사진을 살짝 움직임
        if (this.mode==='speaking'){ tx = Math.sin(t/1100)*0.25; ty = Math.sin(t/700)*0.18; }
        else if (this.mode==='listening'){ ty = Math.max(0,Math.sin(t/420))*0.3; }
      } else sc = 1;
      this.vid.cam.style.transform = `scale(${sc.toFixed(4)}) translate(${tx.toFixed(2)}%, ${ty.toFixed(2)}%)`;
      return;
    }
    if (C.kit){ this.tickKit(t, C, M); return; }
    if (C.img){ this.tickImg(t, C, M); return; }
    let tgt = SHAPES.rest, k = 1;
    if (this.mode==='speaking'){ const s = Lip.current(t); tgt = SHAPES[s.shape]||SHAPES.rest; k = s.k * (M.open||1); }
    else if (C.idleGrin && M.happy){ tgt = {w:40, h:9}; }          // 기쁠 때 활짝 웃는 입
    else if (C.idleGrin && this.mood==='annoyed'){ tgt = {w:30, h:3}; }
    const tw = tgt.w*(C.mouthW||1), th = tgt.h*k*(C.mouthH||1);
    const f = 0.42;
    this.cur.w += (tw-this.cur.w)*f; this.cur.h += (th-this.cur.h)*f;
    const smileT = (this.mode==='speaking'? (M.speak??M.smile*0.5) : M.smile) * (C.mouthW||1);
    this.smileCur += (smileT-this.smileCur)*0.12;
    const {d,up,lo} = this.mouthD(this.cur.w, this.cur.h, this.smileCur);
    P.mLine.setAttribute('d', d); P.mClip.setAttribute('d', d);
    const open = this.cur.h > 1.4;
    P.mIn.setAttribute('d', d); P.mIn.style.display = open? '' : 'none';
    P.teeth.setAttribute('y', up-6); P.teeth.setAttribute('height', Math.max(0,(this.cur.h*0.32)+4));
    P.tongue.setAttribute('cy', lo-2); P.tongue.setAttribute('rx', this.cur.w*0.28); P.tongue.setAttribute('ry', Math.max(0,this.cur.h*0.28));
    // brows
    const amp = C.browAmp || 1;
    // 말할 때 입이 크게 벌어지면 눈썹도 함께 들썩임 (표정이 큰 캐릭터)
    const bounce = (C.browBounce && this.mode==='speaking') ? -Math.min(6, this.cur.h*0.16) : 0;
    ['bl','br'].forEach(side=>{ for(let i=0;i<2;i++){ const want = M[side][i]*amp + bounce; this.brow[side][i] += (want-this.brow[side][i])*0.18; } });
    const bd = browD(C, this.brow.bl, this.brow.br);
    P.bl.setAttribute('d', bd.l); P.br.setAttribute('d', bd.r);
    // eyes / blink
    if (t > this.blinkAt){ this.blinkT = t; this.blinkAt = t + 2200 + Math.random()*3200; }
    const bp = (t - this.blinkT)/140; const sy = bp<1? Math.max(0.1, Math.abs(1-2*bp)) : 1;
    const lookY = this.mode==='thinking'? -3 : 0, lookX = this.mode==='thinking'? 3 : 0;
    P.eyes.forEach(e=>{
      const cx=+e.dataset.cx, cy=+e.dataset.cy;
      e.querySelector('.eye-open').setAttribute('transform', `translate(${cx+lookX} ${cy+lookY}) scale(1 ${sy}) translate(${-cx} ${-cy})`);
      e.querySelector('.eye-open').style.display = M.happy? 'none':'';
      e.querySelector('.eye-happy').style.display = M.happy? '':'none';
    });
    // head & body motion
    let rot = 0, ty = 0;
    if (this.mode==='speaking'){ rot = Math.sin(t/620)*1.6 + Math.sin(t/233)*0.5; ty = Math.sin(t/410)*1.2; }
    else if (this.mode==='listening'){ ty = Math.max(0,Math.sin(t/330))*3.2; rot = Math.sin(t/1400)*0.8; }
    else if (this.mode==='thinking'){ rot = -3.2 + Math.sin(t/900)*0.4; }
    else { rot = Math.sin(t/2600)*0.7; }
    P.head.setAttribute('transform', `rotate(${rot.toFixed(2)} 240 250) translate(0 ${ty.toFixed(2)})`);
    P.body.setAttribute('transform', `translate(0 ${(Math.sin(t/1500)*1.3).toFixed(2)})`);
  }
};

/* 입모양 싱크 엔진: 한글 음절 → 모음별 입모양, 양순음(ㅁㅂㅍ)은 입 닫기 */
const Lip = {
  seg:[], t0:0, total:0, active:false,
  build(text, rate, estimateOnly){
    const base = 150 / rate * (state.sylFactor||1);
    const seg = []; let t = 0;
    const push = (dur, shape, k, ci)=>{ seg.push({a:t, b:t+dur, shape, k, ci}); t += dur; };
    for (let i=0;i<text.length;i++){
      const ch = text[i], c = ch.charCodeAt(0);
      if (c>=0xAC00 && c<=0xD7A3){
        const n = c-0xAC00, cho = Math.floor(n/588), jung = Math.floor((n%588)/28), jong = n%28;
        const vs = VOWEL_SHAPE[jung];
        const bilabialStart = [6,7,8,17].includes(cho), bilabialEnd = [16,17,18,26].includes(jong);
        const k = 0.75 + Math.random()*0.35;
        if (bilabialStart) push(base*0.28,'closed',1,i);
        push(base*(bilabialStart?0.52:0.72) + (jong?0:base*0.1), vs, k, i);
        if (jong) push(base*0.2, bilabialEnd?'closed':vs, bilabialEnd?1:k*0.45, i);
        else push(base*0.1, vs, k*0.6, i);
      } else if (/[.?!…]/.test(ch)) push(base*2.2,'rest',1,i);
      else if (/[,~]/.test(ch)) push(base*1.4,'rest',1,i);
      else if (/\s/.test(ch)) push(base*0.25,'rest',1,i);
      else if (/[0-9]/.test(ch)) { push(base*0.9,'E',1,i); push(base*0.9,'A',0.8,i); }
      else if (/[A-Za-z]/.test(ch)) push(base*0.75,'E',0.9,i);
    }
    if (estimateOnly) return t;
    this.seg = seg; this.total = t; return t;
  },
  start(){ this.t0 = performance.now(); this.active = true; },
  sync(ci){ // TTS 단어 경계 이벤트로 재동기화
    const s = this.seg.find(x=>x.ci>=ci); if (!s) return;
    const now = performance.now(), want = now - s.a;
    if (Math.abs(want - this.t0) > 90) this.t0 = want;
  },
  current(t){
    if (!this.active) return {shape:'rest',k:1};
    const e = t - this.t0;
    if (e > this.total){ // 예상보다 말이 길어질 때: 가볍게 움직임 유지
      return {shape: (Math.floor(e/140)%2)?'E':'I', k:0.5};
    }
    let lo=0, hi=this.seg.length-1;
    while(lo<=hi){ const m=(lo+hi)>>1, s=this.seg[m]; if (e<s.a) hi=m-1; else if (e>=s.b) lo=m+1; else return s; }
    return {shape:'rest',k:1};
  },
  stop(){ this.active = false; }
};

/* =========================================================
   음성 합성 (TTS)
   ========================================================= */
const Voice = {
  voices:[], enabled:true, subtitles:true, rate:1.0, choice:{},
  init(){
    if (!('speechSynthesis' in window)) { this.enabled = false; return; }
    const load = ()=>{ this.voices = speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang)); };
    load(); try{ speechSynthesis.onvoiceschanged = load; }catch(e){}
  },
  pick(listener){
    if (this.choice[listener]) { const v = this.voices.find(x=>x.name===this.choice[listener]); if (v) return v; }
    const L = LISTENERS[listener];
    const male = /male(?!.*female)|InJoon|Hyunsu|BongJin|GookMin|남성|Minsu|Jun/i;
    const female = /female|Heami|SunHi|Yuna|Sora|JiMin|Seoyeon|여성|Google 한국/i;
    let v = L.voice==='male' ? this.voices.find(x=>male.test(x.name)) : this.voices.find(x=>female.test(x.name)&&!/InJoon/i.test(x.name));
    return v || this.voices[0] || null;
  },
  token:0,
  // 문장 단위로 나눠 말해서 문장마다 억양(음높이·빠르기)을 달리함
  split(text){ return (text.match(/[^.?!…]+[.?!…]*\s*/g)||[text]).map(x=>x.trim()).filter(Boolean); },
  prosody(listener, sentence, i, mood){
    const L = LISTENERS[listener], P = L.prosody || {};
    let pitch = L.pitch, rate = P.rate || 1, volume = 1;
    if (P.vary) pitch += (i%2 ? -P.vary*0.6 : P.vary*0.4);           // 문장마다 높낮이 오르내림
    if (/\?\s*$/.test(sentence)) pitch += P.question || 0.04;       // 물음표: 끝을 올림
    if (/!\s*$/.test(sentence)) { pitch += P.exclaim || 0.03; volume = 1; }
    const m = (P.mood||{})[mood]; if (m){ pitch += m.pitch||0; rate += m.rate||0; }
    return { pitch:Math.max(0.5, Math.min(1.6, pitch)), rate, volume };
  },
  speak(text, listener, onDone){
    const my = ++this.token; let finished = false; const timers = [];
    const done = ()=>{ if (finished || my!==this.token) return; finished = true; timers.forEach(clearTimeout); Lip.stop(); Avatar.setMode('idle'); setStatus('idle'); onDone && onDone(); };
    showSubtitle(text);
    Avatar.setMode('speaking'); setStatus('speaking');
    const P = LISTENERS[listener].prosody || {};
    let faked = false;
    const fake = ()=>{ if (my!==this.token || faked) return; faked = true; const est = Lip.build(text, this.rate*(P.rate||1)); Lip.start(); timers.push(setTimeout(done, est+200)); };
    if (!this.enabled || !('speechSynthesis' in window)) { fake(); return; }
    try{
      speechSynthesis.cancel();
      const v = this.pick(listener), mood = Avatar.mood, chunks = this.split(text);
      const isMaleVoice = v && /male(?!.*female)|InJoon|Hyunsu/i.test(v.name);
      let anyStarted = false;
      chunks.forEach((c,i)=>{
        const u = new SpeechSynthesisUtterance(c); u.lang = 'ko-KR'; if (v) u.voice = v;
        const pr = this.prosody(listener, c, i, mood);
        u.rate = Math.min(2, this.rate*pr.rate);
        u.pitch = (LISTENERS[listener].voice==='male' && isMaleVoice) ? Math.max(0.6, pr.pitch + (1-LISTENERS[listener].pitch)) : pr.pitch;
        u.volume = pr.volume;
        let st = 0, est = 0;
        u.onstart = ()=>{ if (my!==this.token) return; anyStarted = true; st = performance.now(); est = Lip.build(c, u.rate); Lip.start(); };
        u.onboundary = e=>{ if (my===this.token && typeof e.charIndex==='number') Lip.sync(e.charIndex); };
        u.onend = ()=>{
          if (my!==this.token) return;
          if (st){ const r = (performance.now()-st)/Math.max(300,est); state.sylFactor = Math.min(1.8, Math.max(0.6, (state.sylFactor||1)*(0.6+0.4*r))); }
          Lip.stop();                                    // 문장 사이에서 입을 닫아 또렷하게 끊어 말함
          if (i===chunks.length-1) done();
        };
        u.onerror = ()=>{ if (my!==this.token) return; if (!anyStarted) fake(); else if (i===chunks.length-1) done(); };
        speechSynthesis.speak(u);
      });
      timers.push(setTimeout(()=>{ if (!anyStarted && my===this.token){ try{speechSynthesis.cancel();}catch(e){} fake(); } }, 2500));
      const totalEst = Lip.build(text, this.rate, true);
      timers.push(setTimeout(()=>{ if (!finished && my===this.token && !speechSynthesis.speaking) done(); }, totalEst*2.2+4000));
      timers.push(setTimeout(()=>done(), totalEst*4+12000));
    }catch(e){ fake(); }
  },
  stop(){ this.token++; try{ speechSynthesis.cancel(); }catch(e){} Lip.stop(); if (typeof Clips!=='undefined') Clips.stop(); Avatar.setMode('idle'); }
};

/* =========================================================
   음성 인식 (STT)
   ========================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
// 이 화면(Claude 안의 틀)에서 브라우저가 마이크를 허용하는지 미리 확인
function micAllowedByFrame(){
  try{
    const pol = document.permissionsPolicy || document.featurePolicy;
    if (pol && typeof pol.allowsFeature==='function') return pol.allowsFeature('microphone');
  }catch(e){}
  return true;
}
const Rec = {
  r:null, on:false, base:'', blocked: !SR || !micAllowedByFrame(),
  start(){
    if (this.blocked) return false;
    try{
      const r = new SR(); this.r = r; r.lang='ko-KR'; r.interimResults=true; r.continuous=true;
      this.base = $('#say').value ? $('#say').value.trim()+' ' : '';
      r.onresult = e=>{
        let fin='', intr='';
        for (let i=0;i<e.results.length;i++){ const x=e.results[i]; (x.isFinal? (fin+=x[0].transcript) : (intr+=x[0].transcript)); }
        $('#say').value = (this.base + fin + intr).replace(/\s+/g,' '); updateSend();
      };
      r.onerror = e=>{ if (!['no-speech','aborted'].includes(e.error)){ this.blocked = true; Mic.fallback(); } };
      r.onend = ()=>{ this.on=false; Mic.recEnded(); };
      r.start(); this.on = true; return true;
    }catch(e){ this.blocked = true; return false; }
  },
  stopRec(){ try{ this.r && this.r.stop(); }catch(e){} }
};
/* 말하기 ↔ 완료 버튼 하나로 녹음 시작과 끝을 조절 */
const Mic = {
  active:false, mode:null, finishing:false, guard:null,
  toggle(){
    if (!state.started){ $('#playBtn').click(); return; }
    if (state.busy || state.over) return;
    this.active ? this.finish() : this.begin();
  },
  begin(){
    Voice.stop(); $('#errBox').innerHTML = '';
    $('#say').value = ''; updateSend();
    this.active = true; this.finishing = false;
    if (Rec.start()){ this.mode = 'sr'; showVoiceHelp(false); }
    else this.fallback();
    micUI(); Avatar.setMode('listening'); setStatus('listening');
  },
  // 마이크가 막혀 있으면 컴퓨터 자체의 받아쓰기 기능으로 말하게 함
  fallback(){
    this.mode = 'dictation'; showVoiceHelp(true);
    if (this.active){ const t = $('#say'); t.focus(); }
  },
  recEnded(){
    if (this.finishing){ this.finishing = false; clearTimeout(this.guard); this.submit(); return; }
    // 말을 잠깐 쉬어서 인식이 저절로 끝난 경우: 완료를 누를 때까지 계속 듣기
    if (this.active && this.mode==='sr' && !Rec.blocked){ setTimeout(()=>{ if (this.active && !Rec.on && !Rec.start()) this.fallback(); }, 150); }
  },
  finish(){
    this.active = false; micUI();
    if (this.mode==='sr' && Rec.on){
      this.finishing = true; Rec.stopRec();
      this.guard = setTimeout(()=>{ if (this.finishing){ this.finishing = false; this.submit(); } }, 1500);
    } else this.submit();
  },
  submit(){
    if (!state.busy && !state.over && Avatar.mode==='listening'){ Avatar.setMode('idle'); setStatus('idle'); }
    if ($('#say').value.trim()) send();
    else $('#errBox').innerHTML = `<div class="err">말한 내용이 글자로 바뀌지 않았어요. <b>말하기</b>를 다시 누르고 말해 주세요.</div>`;
  },
  reset(){ this.active = false; this.finishing = false; clearTimeout(this.guard); if (Rec.on) Rec.stopRec(); micUI(); }
};
function micUI(){
  const b = $('#micBtn'); if (!b) return;
  b.classList.toggle('rec', Mic.active);
  $('#micLabel').textContent = Mic.active ? '완료' : '말하기';
  b.title = Mic.active ? '말을 다 했으면 눌러서 보내기' : '눌러서 말하기';
}
function showVoiceHelp(strong){
  const os = navigator.userAgent;
  const tip = /iPhone|iPad|Android/i.test(os) ? '키보드의 <b>🎤 마이크 버튼</b>을 누르고 말하세요.'
    : /Mac/i.test(os) ? '<b>fn 키를 두 번</b> 눌러 받아쓰기를 켜고 말하세요.'
    : /CrOS/i.test(os) ? '<b>검색 + D</b>를 눌러 음성 입력을 켜고 말하세요.'
    : '<b>⊞ Windows 키 + H</b>를 눌러 음성 입력을 켜고 말하세요.';
  const h = $('#voiceHelp');
  h.classList.toggle('strong', !!strong);
  h.innerHTML = strong
    ? `🎙️ 이 화면에서는 브라우저가 마이크를 직접 쓸 수 없어서, 컴퓨터의 받아쓰기 기능으로 말해요. <b>말하기</b>를 누른 다음 ${tip} 다 말했으면 <b>완료</b>를 누르세요.`
    : '🎙️ 듣고 있어요. 다 말했으면 <b>완료</b>를 누르세요.';
}

const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = { scenario:null, listener:null, item:ITEMS[0], pet:PETS[0], level:'normal', name:'', turn:0, history:[], evals:[],
  got:{}, tried:{}, concerns:{}, booth:false, hints:0, over:false, busy:false, sylFactor:1, lastLine:'', started:false };

function need(){ return LV().need; }
function progress(){
  const g = state.got;
  const arg = ARG.filter(t=>g[t]);
  const rat = RATIONAL.filter(t=>g[t]);
  const cDone = Object.keys(state.concerns).length;
  const c = {
    arg: arg.length>0, rat: rat.length>=2, emo: !!g['감성'], eth: !!g['인성'],
    concerns: cDone>=need(), booth: state.scenario!=='booth' || state.booth,
    argList:arg, ratList:rat, cDone
  };
  c.ratAny = rat.length>0;
  c.kinds = [c.ratAny, c.emo, c.eth].filter(Boolean).length;
  if (state.level==='easy') c.win = c.kinds>=2 && c.concerns && c.booth;
  else if (state.level==='normal') c.win = c.ratAny && c.emo && c.eth && c.concerns && c.booth;
  else c.win = c.arg && c.rat && c.emo && c.eth && c.concerns && c.booth;
  return c;
}
// 난이도별 성공 조건 목록
function conditions(p){
  const g = state.got, n = need();
  const chip = (t,on)=>`<span class="mchip ${on?'y':''}">${t}</span>`;
  const con = {k:'con', ok:p.concerns, t:`걱정 해결 (${Math.min(p.cDone,n)}/${n})`, d:`<ul class="concern-list">${state.concernList.map(c=>`<li class="${state.concerns[c.id]?'y':'n'}">${c.short}: ${esc(c.text)}</li>`).join('')}</ul>`};
  const emo = {k:'emo', ok:p.emo, t:'감성적 전략', d:'상대의 감정·마음에 호소하기'};
  const eth = {k:'eth', ok:p.eth, t:'인성적 전략', d:'나의 경험·전문성·품성·성실한 태도로 믿음 주기. 품성과 태도는 구체적인 행동으로 보여 주기'};
  let L;
  if (state.level==='easy') L = [
    {k:'kinds', ok:p.kinds>=2, t:`설득 전략 2가지 이상 (${Math.min(p.kinds,2)}/2)`, d:`<div class="minis">${chip('이성적',p.ratAny)}${chip('감성적',p.emo)}${chip('인성적',p.eth)}</div>`}, con];
  else if (state.level==='normal') L = [
    {k:'rat1', ok:p.ratAny, t:'이성적 전략', d:`<div class="minis">${RATIONAL.map(t=>chip(t,!!g[t])).join('')}</div>`}, emo, eth, con];
  else L = [
    {k:'arg', ok:p.arg, t:'논증 1개 이상', d:`<div class="minis">${ARG.map(t=>chip(t,!!g[t])).join('')}</div>`},
    {k:'rat', ok:p.rat, t:`이성적 전략 2가지 (${Math.min(2,p.ratList.length)}/2)`, d:`<div class="minis">${['통계·자료','전문가 의견','사실·사례'].map(t=>chip(t,!!g[t])).join('')}<span class="mchip" style="border-style:dashed">+ 논증</span></div>`},
    emo, eth, con];
  if (state.scenario==='booth') L.push({k:'booth', ok:state.booth, t:'부스 계획 구체적으로 말하기', d:'무엇을 하는 부스인지, 어떻게 운영할지'});
  return L;
}

function staticFace(svg, kind){
  const C = CHAR[kind] || {};
  if (C.img || C.kit || C.video) return;
  const m = Avatar.mouthD(34*(C.mouthW||1), 0, 4*(C.mouthW||1), C.mouthY||218);
  svg.querySelector('.mouth-line').setAttribute('d', m.d); svg.querySelector('.mouth-in').style.display='none';
  const b = browD(C, [-2,-2], [-2,-2]);
  svg.querySelector('.brow-l').setAttribute('d', b.l); svg.querySelector('.brow-r').setAttribute('d', b.r);
}

async function getSample(){
  for (let i=0;i<40 && !(window.claude && window.claude.use);i++) await new Promise(r=>setTimeout(r,250));
  if (!(window.claude && window.claude.use)) return null;
  return await window.claude.use('sample');
}
function parseJSON(t){
  if (t && typeof t==='object') return t;
  const s = String(t||''); const a = s.indexOf('{'), b = s.lastIndexOf('}');
  return JSON.parse(s.slice(a, b+1));
}
// onReply: 대답(reply)이 먼저 도착하면 평가가 끝나기 전에 바로 말하게 함
async function askAI(prompt, onReply, onFront){
  const sample = await getSample();
  if (!sample) throw {code:'unavailable'};
  const opts = {modelTier:'default', cache:false};
  let r;
  if (onReply || onFront){
    let sent = false, fsent = false;
    opts.onText = ({text})=>{
      if (typeof text!=='string') return;
      if (onFront && !fsent){ const f = text.match(/"front"\s*:\s*"([^"]+)"/); if (f){ fsent = true; onFront(f[1].trim()); } }
      if (!onReply || sent) return;
      const m = text.match(/"reply"\s*:\s*"((?:[^"\\]|\\.)*)"/);
      if (m){ try{ const t = JSON.parse('"'+m[1]+'"'); if (t.trim()){ sent = true; onReply(t); } }catch(e){} }
    };
    const o = await sample(prompt, opts);
    r = parseJSON(o.text);
    if (r && r.value && !r.reply) r = r.value;
    if (onFront && !fsent && r && r.front){ fsent = true; onFront(String(r.front).trim()); }
    if (onReply && !sent && r && typeof r.reply==='string'){ sent = true; onReply(r.reply); }
    return r;
  }
  if (typeof sample.json==='function'){
    try{ r = await sample.json(prompt, opts); }catch(e){ if (e && e.code) throw e; r = null; }
  }
  if (!r){ const o = await sample(prompt, opts); r = parseJSON(o.text); }
  if (typeof r==='string') r = parseJSON(r);
  if (r && r.value && !r.reply) r = r.value;
  return r;
}

[설득 전략 분류]
- 이성적 설득 전략: 논리적 근거로 이성에 호소. 세부 유형: 귀납, 연역, 유추(이 셋이 '논증'), 통계·자료(수치, 조사 결과), 전문가 의견(권위 있는 사람이나 기관의 말), 사실·사례(객관적 사실이나 사례 1개).
- 사실·사례의 기준(모든 난이도 공통): 누구나 확인할 수 있는 객관적인 사실이나 사례여야 한다. 지극히 개인적이고 주관적인 판단은 사실·사례로 인정하지 않는다(valid:false). 예) "내 핸드폰이 너무 낡았어요", "공부하기 너무 불편해요", "친구들은 다 있어요"처럼 정도나 근거 없이 느낌·판단만 말한 것은 불인정. 학생 자신의 물건이나 상황에 관한 것이라도 확인할 수 있는 구체적인 사실(산 지 몇 년인지, 어떤 기능이 어떻게 안 되는지, 수치 등)이 드러나면 인정한다. 예) "4년 전에 산 폰인데 배터리가 2시간이면 꺼지고 수업 앱이 실행되지 않아요"는 인정. 불인정했으면 feedback.improve에서 어떤 구체적 사실을 덧붙이면 되는지 알려 준다.
- 감성: 감성적 설득 전략. 청자의 감정(공감, 기쁨, 뿌듯함, 미안함, 그리움 등)에 호소.
- 인성: 인성적 설득 전략. 말하는 사람의 공신력으로 믿음을 얻음. 화자의 경험(주제와 관련된 실제 경험), 전문성(지식, 또는 학생은 스스로 전문가가 될 수 없으므로 자료를 충분히 검토하고 출처를 정확히 밝혀 빌려 온 전문성), 품성, 성실하고 진지한 태도를 중점적으로 본다. 품성과 태도는 말로만 주장해서는 안 되고, 구체적인 행동 근거로 진정성이 확인되어야 한다.

${levelRule}

[지금까지 인정된 것] 전략: ${gotStr} / 해결된 걱정: ${conStr}${state.scenario==='booth'?` / 부스 계획 제시: ${state.booth?'완료':'아직'}`:''}
[남은 말하기 기회] 이번 발언 포함 ${maxTurns() - state.turn + 1}번

[지금까지의 대화]
${hist}

[이번 학생 발언]
"${utter}"
(음성 인식으로 받아 적은 말이라 띄어쓰기나 오타가 있을 수 있다. 뜻을 헤아려 판단하라.)

[출력] 아래 형식의 JSON 객체 하나만 출력한다. 다른 글은 쓰지 않는다. 키는 반드시 아래 순서대로 쓴다(${Clips.on()?'front, reply 순서로 맨 처음':'reply가 맨 처음'}).
{${Clips.on()?`
 "front":"이성|감성|인성|부족|떼쓰기|해결1|해결2|해결3 중 하나 (가장 먼저 쓴다)",`:''}
 "reply":"청자의 대답 (가장 먼저 쓴다)",
 "mood":"doubtful|neutral|warm|happy|annoyed 중 하나",
 "strategies":[{"type":"귀납|연역|유추|통계·자료|전문가 의견|사실·사례|감성|인성 중 하나","valid":true,"quote":"학생 발언에서 해당 부분을 짧게 그대로","reason":"인정하거나 인정하지 않은 이유 한 문장"}],
 "concerns":[{"id":1,"resolved":true,"reason":"한 문장"}],
 "boothSpecified":false,
 "feedback":{"good":"잘한 점","improve":"부족한 점과 개선 방향"},
 "acceptReply":"청자가 마침내 설득되어 허락하는 말"
}

${Clips.on()?`[청자의 첫 반응 front]
이번 발언에 대한 청자의 첫 반응 하나를 고른다. 이번 발언으로 새로 해결된 걱정이 있으면 해결N(N은 걱정 번호). 그렇지 않고 이번에 인정되는 전략이 있으면 가장 두드러진 하나를 이성, 감성, 인성 중에서. 전략을 시도했지만 기준에 못 미치거나, 근거가 약하거나, 걱정에 대해 막연한 약속만 하거나, 같은 말을 되풀이하면 부족. 떼쓰기, 협박, 장난, 무례하거나 엉뚱한 말이면 떼쓰기.

`:''}[평가 규칙]
- strategies: 이번 발언에 실제로 있는 전략만 적는다. 발언의 한 부분은 가장 알맞은 한 가지 유형으로만 분류한다. 단, 출처를 밝힌 자료는 예외다: 자료의 내용(수치, 전문가의 말)을 근거로 쓴 것은 이성적 전략(통계·자료 또는 전문가 의견)으로, 출처를 밝히고 직접 검토했음을 드러낸 것은 인성으로, 두 항목을 따로 적어 함께 인정할 수 있다. 전략을 시도했지만 기준에 못 미치면 valid:false로 적고 이유를 쓴다. 전략이 없으면 빈 배열.
- concerns: 이번 발언에서 다룬 걱정만 적는다. 이미 해결된 걱정은 적지 않는다. 막연한 약속이라 인정하지 않은 걱정은 resolved:false로 적고 reason에 무엇이 부족한지(방법, 목표 수치, 기한 등) 쓴다. 이때 feedback.improve에서 약속을 어떻게 구체적으로 바꾸면 되는지 알려 주고, 청자의 대답(reply)에서는 "어떻게 할 건데?", "얼마나?"처럼 구체적인 내용을 되묻는다.
- feedback: 선생님 말투(해요체)로, 중3 눈높이에서 격려하며 쓴다. good은 이번 발언의 학생 표현을 짚어 구체적으로 1~2문장. 잘한 점이 거의 없으면 시도나 태도를 칭찬한다. improve는 부족한 점과 바로 써먹을 수 있는 개선 방법 1~2문장. ${hard?'형식 요건(사례 수, 3단 논법, 유사성, 근거의 연관성)에 맞지 않은 부분을 분명히 짚는다.':'아직 쓰지 않은 전략이나 남은 걱정을 넌지시 알려 준다.'}
- mood: 이번 발언을 들은 청자의 기분.

[청자 대답 규칙]
- ${L.name}의 말투로, 소리 내어 읽을 1~3문장(120자 이내). 이모지, 괄호, 지문, 따옴표, 영어 약어는 쓰지 않는다.
- 학생의 말에 구체적으로 반응한다. 설득력 있는 부분은 인정하고, 근거가 약하면 되묻는다.
- 해결된 걱정은 다시 고집하지 않고, 아직 남은 걱정 하나를 자연스럽게 다시 꺼낸다.${state.scenario==='booth'?' 부스 계획이 아직 구체적이지 않으면 무엇을 어떻게 운영할지 묻는다.':''}
- reply에서는 아직 최종 허락을 하지 않는다. 마음이 기울면 "조금 생각이 바뀌는구나" 정도까지는 말할 수 있다.
- acceptReply는 결국 설득되어 허락하는 1~2문장. 이번 발언 내용을 반영하고, 가벼운 조건이나 약속을 덧붙여도 된다.
- 학생 발언이 장난, 무관한 말, 무례한 말이면 캐릭터를 유지하며 대화로 돌아오게 하고 strategies는 빈 배열로 한다.`;
}

async function send(){
  const utter = $('#say').value.trim(); if (!utter || state.busy || state.over) return;
  Mic.reset(); Voice.stop();
  state.busy = true; state.turn++; renderTurns(); updateSend();
  state.history.push({role:'student', text:utter, turn:state.turn});
  $('#say').value=''; $('#errBox').innerHTML=''; $('#hintBox').innerHTML='';
  $('#subtitle').innerHTML = `<span style="background:rgba(47,125,109,.85)">나: ${esc(utter)}</span>`;
  Avatar.setMode('thinking'); setStatus('thinking');
  const clipMode = Clips.on();
  let r, early = null, eclip = null;
  // 대사 영상 모드: 첫 반응이 정해지는 즉시 그 영상을 틀어 줌
  const onFront = f=>{
    if (state.over || eclip) return; const id = FRONT_CLIP[f]; if (!id) return;
    eclip = {id, done:false, after:null};
    Clips.play([id], ()=>{ eclip.done = true; const g = eclip.after; eclip.after = null; g && g(); });
  };
  // 대답이 먼저 도착하면 평가를 기다리지 않고 바로 말함
  const onReply = txt=>{
    if (state.over) return;
    early = {text:txt, done:false, after:null};
    Avatar.setMood('neutral');
    sayLine(txt, ()=>{ early.done = true; const f = early.after; early.after = null; f && f(); });
  };
  try{
    // 규칙 기반 판정 (judge.js). 생각하는 듯 잠깐 뜸을 들인 뒤 대답
    await new Promise(res=>setTimeout(res, 700 + Math.random()*500));
    r = localJudge(utter);
    if (!r || typeof r.reply!=='string') throw {code:'bad'};
  }catch(e){
    if (state.over) return;
    if (early || eclip) Voice.stop();
    state.turn--; state.history.pop(); state.busy=false; renderTurns();
    $('#say').value = utter; updateSend(); Avatar.setMode('idle'); setStatus('idle'); $('#subtitle').innerHTML='';
    const msg = e && e.code==='not_granted' ? 'AI 사용이 허용되지 않았어요. 허용 창에서 허용한 뒤 다시 보내 주세요.'
      : e && e.code==='rate_limited' ? 'AI가 잠깐 바빠요. 30초쯤 뒤에 다시 보내 주세요. (기회는 줄지 않았어요)'
      : e && e.code==='unavailable' ? '이 화면에서는 AI를 불러올 수 없어요. Claude에 로그인한 상태로 이 페이지를 열어 주세요.'
      : '판정하는 중에 문제가 생겼어요. 다시 보내 주세요. (기회는 줄지 않았어요)'; console.error(e);
    $('#errBox').innerHTML = `<div class="err">${msg}</div>`;
    return;
  }
  if (state.over) return;   // 기다리는 동안 시간이 끝난 경우
  // 평가 반영
  const strategies = (Array.isArray(r.strategies)? r.strategies : []).filter(s=>s && ALL_TYPES.includes(s.type));
  strategies.forEach(s=>{ if (s.valid){ if (!state.got[s.type]) state.got[s.type] = {turn:state.turn, quote:s.quote||''}; } else state.tried[s.type]=true; });
  const concerns = (Array.isArray(r.concerns)? r.concerns : []).filter(c=>c && c.resolved && state.concernList.some(x=>x.id==c.id));
  concerns.forEach(c=>{ if (!state.concerns[c.id]) state.concerns[c.id] = {turn:state.turn, reason:c.reason||''}; });
  if (state.scenario==='booth' && r.boothSpecified) state.booth = true;
  const fb = r.feedback || {};
  state.evals.push({turn:state.turn, utter, strategies, concerns, booth:!!r.boothSpecified, good:fb.good||'', improve:fb.improve||''});
  renderFeedback(state.evals[state.evals.length-1]);
  renderChecklist();

  const p = progress();
  if (clipMode){ playClipAnswer(r, p, strategies, concerns, eclip); return; }
  let end = null, extra = null;
  if (p.win){ extra = r.acceptReply || '그래, 네 말에 설득됐어. 좋아, 허락할게.'; end = 'win'; }
  else if (state.turn >= maxTurns()){ extra = END_LINES[state.scenario]; end = 'lose'; }
  if (early) state.history.push({role:'listener', text:early.text, turn:state.turn});
  else if (!end) state.history.push({role:'listener', text:r.reply, turn:state.turn});
  state.busy = false;
  if (end){ state.over = true; stopTimer(); }
  updateSend();
  const finish = end ? ()=>setTimeout(()=>showResult(end), 900) : null;
  if (end){
    Avatar.setMood(end==='win' ? 'happy' : 'neutral');
    state.history.push({role:'listener', text:extra, turn:state.turn});
    const go = ()=>sayLine(extra, finish);
    if (early && !early.done) early.after = go; else go();
  } else {
    Avatar.setMood(MOODS[r.mood]? r.mood : 'neutral');
    if (!early) sayLine(r.reply);
  }
}

// 대사 영상 모드에서 이번 차례에 틀 영상(앞 조각 + 뒤 조각)을 정함
function playClipAnswer(r, p, strategies, concerns, eclip){
  let front = eclip ? eclip.id : 0;
  if (!front){
    const solved = concerns.find(c=>state.concerns[c.id] && state.concerns[c.id].turn===state.turn);
    const ok = strategies.find(s=>s.valid);
    if (solved) front = {1:10, 2:12, 3:14}[solved.id];
    else if (ok) front = ok.type==='감성' ? 5 : ok.type==='인성' ? 6 : 4;
    else if (strategies.some(s=>s.type==='감성' && !s.valid) || r.mood==='annoyed') front = 8;
    else front = 7;
  }
  let back, end = null;
  if (p.win){ back = 2; end = 'win'; }
  else if (state.turn >= maxTurns()){ back = 3; end = 'lose'; }
  else if (conditions(p).filter(c=>!c.ok).length===1) back = 15;
  else {
    const left = [1,2,3].filter(id=>!state.concerns[id]);
    const pick = left.find(id=>id!==state.lastAsk) || left[0];
    back = pick ? REMAIN_CLIP[pick] : 15; state.lastAsk = pick;
  }
  [front, back].forEach(id=>state.history.push({role:'listener', text:Clips.line(id), turn:state.turn}));
  state.busy = false;
  if (end){ state.over = true; stopTimer(); }
  updateSend();
  const finish = end ? ()=>setTimeout(()=>showResult(end), 900) : null;
  if (eclip && !eclip.done) eclip.after = ()=>Clips.play([back], finish);
  else if (eclip) Clips.play([back], finish);
  else Clips.play([front, back], finish);
}

function renderFeedback(ev){
  $('#fbTurn').textContent = `${ev.turn}번째 말`;
  const chips = ev.strategies.map(s=>`<span class="schip ${s.valid?'v':'x'}" title="${esc(s.reason)}">${s.valid?'✓':'△'} ${esc(s.type)}</span>`).join('')
    + ev.concerns.map(c=>{ const x = state.concernList.find(k=>k.id==c.id); return `<span class="schip c">걱정 해결: ${esc(x?x.short:'')}</span>`; }).join('')
    + (ev.booth && state.scenario==='booth' ? `<span class="schip c">부스 계획 ✓</span>` : '');
  const reasons = ev.strategies.filter(s=>!s.valid && s.reason).map(s=>`<div class="fbmeta">△ ${esc(s.type)}: ${esc(s.reason)}</div>`).join('');
  $('#feedback').innerHTML = `${chips?`<div class="schips">${chips}</div>`:'<div class="fbmeta">이번 말에서는 인정된 전략이 없어요.</div>'}${reasons}
    <div class="fbrow good"><b>잘한 점</b>${esc(ev.good)}</div>
    <div class="fbrow improve"><b>보완할 점</b>${esc(ev.improve)}</div>`;
}

/* ---------- 결과 ---------- */
function showResult(kind){
  stopTimer(); Voice.stop(); Mic.reset();
  const p = progress(), L = LISTENERS[state.listener].name, sc = SCENARIOS[state.scenario];
  const win = kind==='win';
  const typeRow = t=>{ const g = state.got[t]; return `<li class="${g?'ok':''}"><span class="box"></span><div><div class="t">${t}</div><div class="d">${g?`${g.turn}번째 말: "${esc(g.quote)}"`:(state.tried[t]?'시도했지만 인정되지 않았어요':'사용하지 않았어요')}</div></div></li>`; };
  const turnsUsed = state.evals.length;
  const report = buildReport(win, kind);
  $('#result').innerHTML = `
    <div class="result-hero ${win?'win':'lose'}">
      <div class="face" id="resFace"></div>
      <div>
        <span class="tag">${sc.title}${state.scenario==='item'?' · '+esc(state.item):state.scenario==='pet'?' · '+state.pet:''} · ${LV().name}</span>
        <h1 style="margin-top:8px">${win? `설득 성공! 🎉` : kind==='timeout' ? '시간 초과! ⏱' : '아쉽지만 이번엔 설득 실패'}</h1>
        <p>${win? `${turnsUsed}번 만에 ${L}${josa(L,'을','를')} 설득했어요.` : kind==='timeout' ? `7분 30초가 지나서 대화가 끝났어요. 아래에서 부족했던 부분을 확인하고 다시 도전해 보세요.` : `조건을 다 채우지 못했어요. 아래에서 부족했던 부분을 확인하고 다시 도전해 보세요.`}
        ${LV().hints?` · 힌트 ${state.hints}번 사용`:''}</p>
      </div>
    </div>
    <div class="rgrid">
      <div class="panel"><h3>사용한 설득 전략</h3>
        <ul class="check">${['귀납','연역','유추','통계·자료','전문가 의견','사실·사례','감성','인성'].map(typeRow).join('')}</ul></div>
      <div>
        <div class="panel"><h3>성공 조건</h3><ul class="check">
          ${conditions(p).map(c=>[c.t,c.ok]).map(([t,ok])=>`<li class="${ok?'ok':''}"><span class="box"></span><div class="t">${t}</div></li>`).join('')}
        </ul>
        <ul class="concern-list" style="margin-top:10px">${state.concernList.map(c=>`<li class="${state.concerns[c.id]?'y':'n'}">${c.short}${state.concerns[c.id]?` (${state.concerns[c.id].turn}번째 말) ${esc(state.concerns[c.id].reason)}`:''}</li>`).join('')}</ul></div>
        <div class="panel"><h3>결과 복사해서 제출하기</h3>
          <textarea class="report" id="report" readonly>${esc(report)}</textarea>
          <div class="row"><button class="btn teal" id="copyBtn">결과 복사</button><span class="fbmeta" id="copyMsg"></span></div></div>
      </div>
    </div>
    <div class="panel"><h3>말할 때마다 받은 피드백</h3>
      ${state.evals.map(ev=>`<div class="turnfb"><div class="q">${ev.turn}. "${esc(ev.utter)}"</div>
        <div class="schips" style="margin-bottom:6px">${ev.strategies.map(s=>`<span class="schip ${s.valid?'v':'x'}">${s.valid?'✓':'△'} ${esc(s.type)}</span>`).join('')}</div>
        <div class="fbrow good"><b>잘한 점</b>${esc(ev.good)}</div><div class="fbrow improve" style="margin-top:6px"><b>보완할 점</b>${esc(ev.improve)}</div></div>`).join('') || '<p class="fbmeta">기록된 피드백이 없어요.</p>'}
    </div>
    <div class="row" style="justify-content:center;margin:10px 0 30px">
      <button class="btn big" id="againBtn">같은 상황 다시 하기</button><button class="btn ghost" id="homeBtn">다른 상황 고르기</button>
    </div>`;
  $('#talk').classList.add('hidden'); $('#result').classList.remove('hidden');
  const host = $('#resFace'); Avatar.mount(host, state.listener); Avatar.setMood(win?'happy':'doubtful'); Avatar.setMode('idle');
  $('#copyBtn').onclick = async ()=>{
    try{ await navigator.clipboard.writeText(report); $('#copyMsg').textContent='복사했어요!'; }
    catch(e){ const t=$('#report'); t.focus(); t.select(); $('#copyMsg').textContent='선택된 글을 Ctrl+C(⌘+C)로 복사하세요.'; }
  };
  $('#againBtn').onclick = startGame; $('#homeBtn').onclick = goHome;
  window.scrollTo({top:0,behavior:'smooth'});
}
function buildReport(win, kind){
  const p = progress(), L = LISTENERS[state.listener].name, sc = SCENARIOS[state.scenario];
  const lines = [];
  lines.push(`[말로 설득하기 결과] ${state.name||'(이름 없음)'}`);
  lines.push(`상황: ${sc.title}${state.scenario==='item'?' ('+state.item+')':state.scenario==='pet'?' ('+state.pet+')':''} / 청자: ${L} / 난이도: ${LV().name}`);
  lines.push(`결과: ${win?`성공 (${state.evals.length}번째 말)`:kind==='timeout'?'실패 (시간 초과)':'실패'}${LV().hints?` / 힌트 ${state.hints}번`:''}`);
  lines.push(`인정된 전략: ${Object.entries(state.got).map(([t,g])=>`${t}(${g.turn})`).join(', ')||'없음'}`);
  lines.push(`해결한 걱정: ${state.concernList.filter(c=>state.concerns[c.id]).map(c=>c.short).join(', ')||'없음'}${state.scenario==='booth'?` / 부스 계획: ${state.booth?'제시함':'부족'}`:''}`);
  lines.push('— 대화와 피드백 —');
  state.evals.forEach(ev=>{
    lines.push(`${ev.turn}. 나: ${ev.utter}`);
    lines.push(`   잘한 점: ${ev.good}`);
    lines.push(`   보완할 점: ${ev.improve}`);
  });
  return lines.join('\n');
}

/* ---------- init ---------- */
Voice.init();
renderSetup();
</script>
